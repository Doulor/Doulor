name: Generate profile cards

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_cards.js"
      - ".github/workflows/cards.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SVG cards
        run: node scripts/generate_cards.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Doulor

      # 推到 output 分支而不是 main:避免 main 历史被每日自动提交刷屏
      # (snake.yml 已经是这个做法)。README 引用也随之改到 output 分支。
      - name: Publish generated cards
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: assets
          destination_dir: cards
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
