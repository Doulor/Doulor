<svg xmlns="http://www.w3.org/2000/svg" width="880" height="64" viewBox="0 0 880 64">
  <!-- enter doulor.cn · small quiet link button, theme-aware -->
  <style>
    text { font-family: 'Segoe UI', 'Noto Sans SC', -apple-system, sans-serif; }
    .btn   { fill: #f6f8fa; }
    .label { fill: #1f2328; font-size: 13px; font-weight: 500; }
    .arrow { fill: none; stroke: #59636e; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .btn   { fill: #161b22; }
      .label { fill: #9198a1; }
      .arrow { stroke: #59636e; }
    }
  </style>
  <rect class="btn" x="336" y="13" width="208" height="38" rx="19"/>
  <text class="label" x="424" y="37" text-anchor="middle">进入 Doulor Cloud</text>
  <g class="arrow" transform="translate(492,25)">
    <path d="M0 7 H12 M7 1.5 L12.5 7 L7 12.5"/>
  </g>
</svg>
