<svg width="1000" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Doulor animated banner</title>
  <desc id="desc">Animated warm orange banner for Doulor profile.</desc>
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1000" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED"/>
      <stop offset="0.55" stop-color="#FED7AA"/>
      <stop offset="1" stop-color="#FB923C"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-80 0; 80 0; -80 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#9A3412" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1000" height="260" rx="0" fill="url(#bannerBg)"/>
  <path d="M0 184C116 132 211 136 320 178C459 232 587 240 720 183C822 139 908 133 1000 165V260H0V184Z" fill="#FFF7ED" fill-opacity="0.72">
    <animate attributeName="d" dur="9s" repeatCount="indefinite" values="M0 184C116 132 211 136 320 178C459 232 587 240 720 183C822 139 908 133 1000 165V260H0V184Z;M0 172C118 151 229 120 342 166C468 217 592 229 716 176C836 124 916 149 1000 178V260H0V172Z;M0 184C116 132 211 136 320 178C459 232 587 240 720 183C822 139 908 133 1000 165V260H0V184Z"/>
  </path>
  <path d="M0 210C148 166 272 181 400 211C549 247 657 243 792 203C875 178 943 181 1000 198V260H0V210Z" fill="#FDBA74" fill-opacity="0.36">
    <animate attributeName="d" dur="11s" repeatCount="indefinite" values="M0 210C148 166 272 181 400 211C549 247 657 243 792 203C875 178 943 181 1000 198V260H0V210Z;M0 202C135 183 266 161 404 202C548 245 665 232 796 190C885 162 946 187 1000 210V260H0V202Z;M0 210C148 166 272 181 400 211C549 247 657 243 792 203C875 178 943 181 1000 198V260H0V210Z"/>
  </path>

  <g opacity="0.34">
    <rect x="78" y="54" width="72" height="18" rx="9" fill="#FFFFFF">
      <animateTransform attributeName="transform" type="translate" values="0 0; 18 0; 0 0" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="812" y="74" width="96" height="18" rx="9" fill="#FFFFFF">
      <animateTransform attributeName="transform" type="translate" values="0 0; -20 0; 0 0" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g filter="url(#softShadow)">
    <text x="500" y="118" text-anchor="middle" fill="#431407" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="900">Doulor
      <animate attributeName="y" values="118;112;118" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#431407;#9A3412;#431407" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="158" text-anchor="middle" fill="#7C2D12" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="650">青青河畔草，绵绵思远道
      <animate attributeName="opacity" values="0.72;1;0.72" dur="5.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="158;154;158" dur="5.8s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
