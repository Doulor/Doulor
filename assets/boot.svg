<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300">
  <!-- Doulor Cloud boot splash · dark variant -->
  <rect width="880" height="300" fill="#0d1117"/>
  <style>
    text { font-family: 'Segoe UI', 'Noto Sans SC', -apple-system, sans-serif; }
  </style>
  <g transform="translate(392,42) scale(4.4)" fill="none" stroke="#f0f6fc" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"
          stroke-dasharray="55.39" stroke-dashoffset="55.39">
      <animate attributeName="stroke-dashoffset" from="55.39" to="0"
               dur="0.72s" begin="0.15s" fill="freeze"
               calcMode="spline" keySplines="0.3 0.4 0.6 0.8"/>
    </path>
  </g>
  <text x="440" y="206" text-anchor="middle" fill="#f0f6fc" font-size="34" font-weight="500" letter-spacing="-0.8" opacity="0">
    Doulor Cloud
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.85s" fill="freeze"/>
  </text>
  <text x="440" y="238" text-anchor="middle" fill="#8b949e" font-size="14" letter-spacing="2" opacity="0">
    AI-ASSISTED LITTLE WORLDS
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.15s" fill="freeze"/>
  </text>
  <g opacity="0">
    <rect x="330" y="262" width="220" height="3" rx="1.5" fill="#21262d"/>
    <rect x="330" y="262" width="220" height="3" rx="1.5" fill="#3fb950" transform="scale(0 1)" transform-origin="330 263.5">
      <animateTransform attributeName="transform" type="scale" from="0 1" to="1 1" dur="1.1s" begin="1.3s" fill="freeze" calcMode="spline" keySplines="0.3 0.4 0.6 0.8"/>
    </rect>
    <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="1.3s" fill="freeze"/>
  </g>
</svg>
