    <circle cx="238" cy="42" r="24" fill="#FED7AA"/>
    <text x="24" y="42" fill="#431407" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Home</text>
    <text x="24" y="72" fill="#EA580C" font-family="Consolas, monospace" font-size="13" font-weight="700">Personal site · Visual page</text>
    <text x="24" y="102" fill="#7C2D12" font-family="Segoe UI, Arial, sans-serif" font-size="15">一个更像入口和名片的主页。</text>
    <text x="24" y="126" fill="#9A3412" font-family="Consolas, monospace" font-size="13">site · repo · stars 2</text>
  </g>

  <g transform="translate(360 316)">
    <rect width="280" height="140" rx="24" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2"/>
    <circle cx="238" cy="42" r="24" fill="#FFEDD5"/>
    <text x="24" y="42" fill="#431407" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">ElytraFlip</text>
    <text x="24" y="72" fill="#EA580C" font-family="Consolas, monospace" font-size="13" font-weight="700">Minecraft · Plugin</text>
    <text x="24" y="102" fill="#7C2D12" font-family="Segoe UI, Arial, sans-serif" font-size="15">围绕鞘翅玩法的小插件。</text>
    <text x="24" y="126" fill="#9A3412" font-family="Consolas, monospace" font-size="13">modrinth · repo · stars 7</text>
  </g>

  <g transform="translate(666 316)">
    <rect width="280" height="140" rx="24" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2"/>
    <circle cx="238" cy="42" r="24" fill="#FDBA74" opacity="0.72"/>
    <text x="24" y="42" fill="#431407" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">DNSHE Panel</text>
    <text x="24" y="72" fill="#EA580C" font-family="Consolas, monospace" font-size="13" font-weight="700">Panel · Web experiment</text>
    <text x="24" y="102" fill="#7C2D12" font-family="Segoe UI, Arial, sans-serif" font-size="15">网页面板方向的实验项目。</text>
    <text x="24" y="126" fill="#9A3412" font-family="Consolas, monospace" font-size="13">repo · stars 3</text>
  </g>
