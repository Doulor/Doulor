<svg width="1000" height="520" viewBox="0 0 1000 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Doulor showcase card</title>
  <desc id="desc">A warm orange project showcase card listing Doulor's AI-assisted works.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED"/>
      <stop offset="1" stop-color="#FFEDD5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#9A3412" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="968" height="488" rx="32" fill="url(#bg)" stroke="#FB923C" stroke-width="4" filter="url(#shadow)"/>
  <text x="54" y="72" fill="#9A3412" font-family="Consolas, monospace" font-size="15" font-weight="700" letter-spacing="2">SHOWCASE / AI ASSISTED WORKS</text>
  <text x="54" y="116" fill="#431407" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="800">作品橱窗</text>
  <text x="214" y="115" fill="#EA580C" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">small ideas, playable demos, useful tools</text>

  <g transform="translate(54 150)">
    <rect width="280" height="140" rx="24" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2"/>
    <circle cx="238" cy="42" r="24" fill="#FFEDD5"/>
    <text x="24" y="42" fill="#431407" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Quick Ask AI</text>
    <text x="24" y="72" fill="#EA580C" font-family="Consolas, monospace" font-size="13" font-weight="700">AI · PowerToys · Command Palette</text>
    <text x="24" y="102" fill="#7C2D12" font-family="Segoe UI, Arial, sans-serif" font-size="15">把 AI 提问塞进更顺手的入口。</text>
    <text x="24" y="126" fill="#9A3412" font-family="Consolas, monospace" font-size="13">repo · stars 5</text>
  </g>

  <g transform="translate(360 150)">
    <rect width="280" height="140" rx="24" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2"/>
    <circle cx="238" cy="42" r="24" fill="#FDBA74" opacity="0.72"/>
    <text x="24" y="42" fill="#431407" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Starfall</text>
    <text x="24" y="72" fill="#EA580C" font-family="Consolas, monospace" font-size="13" font-weight="700">AI dialogue · H5 game · Story</text>
    <text x="24" y="102" fill="#7C2D12" font-family="Segoe UI, Arial, sans-serif" font-size="15">弹幕躲避和 AI 对话的星域试炼。</text>
    <text x="24" y="126" fill="#9A3412" font-family="Consolas, monospace" font-size="13">play · repo · stars 6</text>
  </g>

  <g transform="translate(666 150)">
    <rect width="280" height="140" rx="24" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2"/>
    <circle cx="238" cy="42" r="24" fill="#FFEDD5"/>
    <text x="24" y="42" fill="#431407" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Blog</text>
    <text x="24" y="72" fill="#EA580C" font-family="Consolas, monospace" font-size="13" font-weight="700">Writing · Personal blog</text>
    <text x="24" y="102" fill="#7C2D12" font-family="Segoe UI, Arial, sans-serif" font-size="15">记录想法、过程和一些折腾。</text>
    <text x="24" y="126" fill="#9A3412" font-family="Consolas, monospace" font-size="13">site · repo · stars 4</text>
  </g>

  <g transform="translate(54 316)">
