<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260">
  <!-- 复刻 Doulor Cloud 开屏动画:云朵描边 720ms cubic-bezier(0.3,0.4,0.6,0.8),站名随后淡入 -->
  <rect width="640" height="260" fill="#0a0a0a"/>
  <g transform="translate(272,50) scale(4)" fill="none" stroke="#fafafa" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"
          stroke-dasharray="55.39" stroke-dashoffset="55.39">
      <animate attributeName="stroke-dashoffset" from="55.39" to="0"
               dur="0.72s" begin="0.1s" fill="freeze"
               calcMode="spline" keySplines="0.3 0.4 0.6 0.8"/>
    </path>
  </g>
  <text x="320" y="205" text-anchor="middle" fill="#fafafa"
        font-family="-apple-system, 'Segoe UI', 'Noto Sans SC', sans-serif"
        font-size="30" font-weight="500" letter-spacing="-0.6" opacity="0">
    Doulor Cloud
    <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.82s" fill="freeze"/>
  </text>
</svg>
