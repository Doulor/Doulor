<svg width="1000" height="280" viewBox="0 0 1000 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Doulor profile card</title>
  <desc id="desc">A warm orange cartoon style profile card for Doulor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED"/>
      <stop offset="0.55" stop-color="#FFEDD5"/>
      <stop offset="1" stop-color="#FED7AA"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#9A3412" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="968" height="248" rx="32" fill="url(#bg)" stroke="#FB923C" stroke-width="4" filter="url(#shadow)"/>
  <path d="M36 74C91 42 144 42 197 74C250 106 303 106 356 74C409 42 462 42 515 74C568 106 621 106 674 74C727 42 780 42 833 74C886 106 939 106 964 88" stroke="#FDBA74" stroke-width="8" stroke-linecap="round" opacity="0.55"/>

  <circle cx="854" cy="92" r="52" fill="#FDBA74" opacity="0.55"/>
  <circle cx="912" cy="148" r="22" fill="#FB923C" opacity="0.5"/>
  <circle cx="94" cy="214" r="42" fill="#FDBA74" opacity="0.42"/>

  <g transform="translate(720 58)">
    <rect width="170" height="128" rx="24" fill="#FFFFFF" stroke="#FB923C" stroke-width="3"/>
    <rect x="22" y="28" width="126" height="22" rx="11" fill="#FFEDD5"/>
    <rect x="22" y="62" width="86" height="16" rx="8" fill="#FED7AA"/>
    <rect x="22" y="91" width="118" height="16" rx="8" fill="#FDBA74"/>
    <circle cx="135" cy="70" r="18" fill="#F97316"/>
    <text x="131" y="76" fill="#FFFFFF" font-family="Consolas, monospace" font-size="18" font-weight="700">&gt;</text>
  </g>

  <text x="62" y="78" fill="#9A3412" font-family="Consolas, monospace" font-size="15" font-weight="700" letter-spacing="2">DOULOR / AI CREATION GALLERY</text>
  <text x="62" y="130" fill="#431407" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800">这里不是技术栈展柜</text>
  <text x="62" y="168" fill="#7C2D12" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="650">是我的 AI 作品陈列室</text>
  <text x="62" y="204" fill="#9A3412" font-family="Segoe UI, Arial, sans-serif" font-size="16">把灵感变成能打开、能体验、能分享的小作品。</text>

  <g transform="translate(62 226)">
    <rect width="128" height="34" rx="17" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2"/>
    <text x="22" y="22" fill="#EA580C" font-family="Consolas, monospace" font-size="14" font-weight="700">9 repos</text>
  </g>
  <g transform="translate(206 226)">
    <rect width="140" height="34" rx="17" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2"/>
    <text x="22" y="22" fill="#EA580C" font-family="Consolas, monospace" font-size="14" font-weight="700">29 stars</text>
  </g>
  <g transform="translate(362 226)">
    <rect width="136" height="34" rx="17" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2"/>
    <text x="22" y="22" fill="#EA580C" font-family="Consolas, monospace" font-size="14" font-weight="700">AI first</text>
  </g>
</svg>
